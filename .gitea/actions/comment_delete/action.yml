name: comment_delete
description: "Delete a comment on an issue"

inputs:
    api_url:
        description: "The Gitea API URL (e.g., https://gitea.com/api/v1)"
        required: false
        default: ${{ github.api_url }}
    repository:
        description: "The repository to delete the comment from (format: owner/repo)"
        required: false
        default: ${{ github.repository }}
    token:
        description: "Gitea personal access token with permissions delete comment on issues"
        required: true
    comment_id:
        description: "The comment ID to delete"
        required: true

runs:
    using: composite
    steps:
        - name: "Delete a comment"
          shell: bash
          env:
              API_URL: ${{ inputs.api_url }}
              REPOSITORY: ${{ inputs.repository }}
              TOKEN: ${{ inputs.token }}
              COMMENT_ID: ${{ inputs.comment_id }}
          run: |
              set -euo pipefail

              curl -sS --fail-with-body -X DELETE \
                  -H "Authorization: token $TOKEN" \
                  -H "Accept: application/json" \
                  "$API_URL/repos/$REPOSITORY/issues/comments/$COMMENT_ID"

              echo "SUCCESS: comment deleted."
