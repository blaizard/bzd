name: comment
description: "Comment on an issue or pull request"

inputs:
    api_url:
        description: "The Gitea API URL (e.g., https://gitea.com/api/v1)"
        required: false
        default: ${{ github.api_url }}
    repository:
        description: "The repository to comment on (format: owner/repo)"
        required: false
        default: ${{ github.repository }}
    issue_number:
        description: "The issue or pull request number to comment on"
        required: true
    token:
        description: "Gitea personal access token with permissions to comment on issues"
        required: true
    body_file:
        description: "Path to a file containing the comment body (supports markdown)"
        required: true

runs:
    using: composite
    steps:
        - name: "Post comment to Gitea"
          shell: bash
          env:
              API_URL: ${{ inputs.api_url }}
              REPOSITORY: ${{ inputs.repository }}
              TOKEN: ${{ inputs.token }}
              ISSUE_NUMBER: ${{ inputs.issue_number }}
              BODY_FILE: ${{ inputs.body_file }}
          run: |
              set -euo pipefail

              payload=$(jq -n --rawfile body "$BODY_FILE" '{body: $body}')

              curl -sS --fail-with-body -X POST \
                  -H "Authorization: token $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "$payload" \
                  "$API_URL/repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments"

              echo "SUCCESS: comment created."
