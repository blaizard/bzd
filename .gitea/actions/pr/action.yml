name: pr
description: "Create a PR"

inputs:
    api_url:
        description: "The Gitea API URL (e.g., https://gitea.com/api/v1)"
        required: false
        default: ${{ github.api_url }}
    repository:
        description: "The repository to comment on (format: owner/repo)"
        required: false
        default: ${{ github.repository }}
    token:
        description: "Gitea personal access token with permissions to create a pr"
        required: true
    title:
        description: "Title of the PR"
        required: true
    body_file:
        description: "Path to a file containing the pr description (supports markdown)"
        required: true
    base_branch:
        description: "The base branch for the PR (default: master)"
        required: false
        default: ${{ github.event.repository.default_branch }}
    head_branch:
        description: "The head branch for the PR (default: current branch)"
        required: true

runs:
    using: composite
    steps:
        - name: "Create a PR"
          shell: bash
          env:
              API_URL: ${{ inputs.api_url }}
              REPOSITORY: ${{ inputs.repository }}
              TOKEN: ${{ inputs.token }}
              TITLE: ${{ inputs.title }}
              BODY_FILE: ${{ inputs.body_file }}
              HEAD_BRANCH: ${{ inputs.head_branch }}
              BASE_BRANCH: ${{ inputs.base_branch }}
          run: |
              set -euo pipefail

              payload=$(jq -n \
                --arg title "$TITLE" \
                --rawfile body "$BODY_FILE" \
                --arg head "$HEAD_BRANCH" \
                --arg base "$BASE_BRANCH" \
                '{title: $title, body: $body, head: $head, base: $base}')

              curl -sS --fail-with-body -X POST \
                  -H "Authorization: token $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "$payload" \
                  "$API_URL/repos/$REPOSITORY/pulls"

              echo "SUCCESS: PR created."
