name: "Run opencode"
description: "Runs the opencode agent"

inputs:
    prompt:
        description: "The prompt to be used for the agent."
        required: true
    agent:
        description: "The agent to be using."
        required: false
        default: "build"
    expect_json:
        description: "Whether the agent output is expected to contain valid JSON."
        required: false
        default: false
    output:
        description: "Path of the agent response file."
        required: false
        default: "/tmp/agent-response.txt"

outputs:
    response_file:
        description: "Path of the raw agent response."
        value: ${{ inputs.output }}

runs:
    using: "composite"
    steps:
        - name: "Opencode version"
          shell: bash
          run: |
              opencode --version

        - name: "Run opencode"
          shell: bash
          env:
              PROMPT: ${{ inputs.prompt }}
              AGENT: ${{ inputs.agent }}
              EXPECT_JSON: ${{ inputs.expect_json }}
              OUTPUT: ${{ inputs.output }}
          run: |
              set -euo pipefail

              EXTRA_ARGS=""
              if [ "$EXPECT_JSON" = "true" ]; then
                  EXTRA_ARGS="--expect-json"
              fi

              ./tools/bazel run //apps/utils/agent -- --output "$OUTPUT" --agent "$AGENT" $EXTRA_ARGS "$PROMPT"

              echo  "==== response ==============================================="
              cat "$OUTPUT"
