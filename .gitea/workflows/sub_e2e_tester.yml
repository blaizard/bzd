name: "Sub: E2E Tester"

on:
    workflow_call:
        inputs:
            prompt:
                description: "The prompt to be used for the agent."
                required: true
                type: string
            agent:
                description: "The agent to be using."
                required: false
                default: "build"
                type: string

jobs:
    cybersecurity:
        runs-on: opencode
        steps:
            - uses: https://git.blaizard.com/blaise/deployment/ci/gitea/setup@main
              with:
                  lease: "true"
                  opencode_token: ${{ secrets.BZD_OPENCODE_TOKEN }}

            - uses: ./.gitea/actions/opencode
              with:
                  agent: ${{ inputs.agent }}
                  prompt: |
                      Act as an end-to-end integration test engineer.

                      FIRST, use Gitea MCP tool to search OPEN issues with titles starting with
                      "[E2E TEST]". If you encounter a failure during testing that matches an existing open issue,
                      skip it and continue testing. Stop only when you find a NEW failure.

                      THEN
                      ${{ inputs.prompt }}

                      IMPORTANT: Stop IMMEDIATELY after finding the FIRST failure.

                      Output your final answer as a single JSON object and NOTHING else, in this exact format:

                      If a failure is found:
                      {
                        "failure_found": true,
                        "title": "...",
                        "description": "...",
                        "reproduction_steps": "..."
                      }

                      If NO failure is found:
                      {
                        "failure_found": false
                      }

            - name: "Extract JSON"
              id: parse
              shell: bash
              run: |
                  bzd-lease ./tools/bazel run //apps/utils/json -- --file /tmp/agent-response.txt --repair --dump > /tmp/agent-response.json

                  echo "==== json =============================================="
                  cat /tmp/agent-response.json

                  failure_found=$(jq -r '.failure_found // false' /tmp/agent-response.json)
                  title=$(jq -r '.title' /tmp/agent-response.json)
                  description=$(jq -r '.description' /tmp/agent-response.json)
                  reproduction_steps=$(jq -r '.reproduction_steps' /tmp/agent-response.json)

                  echo "failure_found=$failure_found" >> "$GITHUB_OUTPUT"
                  echo "ISSUE_TITLE=[E2E TEST] $title" >> "$GITHUB_ENV"
                  {
                    echo "ISSUE_BODY<<__BODY_EOF__"
                    echo "## Description"
                    echo "$description"
                    echo ""
                    echo "## Reproduction Steps"
                    echo "$reproduction_steps"
                    echo ""
                    echo "_Auto-generated by E2E tester agent._"
                    echo "__BODY_EOF__"
                  } >> "$GITHUB_ENV"

            - name: "Create issue"
              if: steps.parse.outputs.failure_found == 'true'
              uses: ./.gitea/actions/issue
              with:
                  token: ${{ secrets.BZD_AGENT_TOKEN }}
                  title: ${{ env.ISSUE_TITLE }}
                  body: ${{ env.ISSUE_BODY }}
