name: "Sub: Update a PR with opencode"

on:
    workflow_call:
        inputs:
            issue_number:
                description: "The issue number to send the comment to."
                required: true
                type: string
            prompt:
                description: "The prompt to be used for the agent."
                required: true
                type: string
            agent:
                description: "The agent to be using."
                required: false
                default: "build"
                type: string

jobs:
    update_pr:
        runs-on: opencode
        steps:
            - uses: https://git.blaizard.com/blaise/deployment/ci/gitea/setup@main
              with:
                  lease: "true"
                  opencode_token: ${{ secrets.BZD_OPENCODE_TOKEN }}

            - uses: ./.gitea/actions/opencode
              with:
                  agent: ${{ inputs.agent }}
                  prompt: ${{ inputs.prompt }}

            - name: "Post comment on PR"
              uses: ./.gitea/actions/comment
              with:
                  issue_number: ${{ inputs.issue_number }}
                  token: ${{ secrets.BZD_AGENT_TOKEN }}
                  body_file: /tmp/agent-response.txt
