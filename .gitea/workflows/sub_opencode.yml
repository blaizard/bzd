name: Run opencode

on:
    workflow_call:
        inputs:
            prompt:
                description: "The prompt to be used for the agent."
                required: true
                type: string
            agent:
                description: "The agent to be using."
                required: false
                default: "build"
                type: string

jobs:
    update_pr:
        runs-on: opencode
        steps:
            - uses: https://git.blaizard.com/blaise/deployment/ci/gitea/setup@main
              with:
                  lease: "true"
                  opencode_token: ${{ secrets.BZD_OPENCODE_TOKEN }}

            - name: "Opencode version"
              run: |
                  opencode --version

            - name: "Run opencode"
              env:
                  PROMPT: ${{ inputs.prompt }}
                  AGENT: ${{ inputs.agent }}
              run: |
                  set -euo pipefail
                  echo  "==== prompt ================================================="
                  echo "$PROMPT"
                  echo  "==== processing ============================================="
                  bzd-lease opencode run --dangerously-skip-permissions --agent "$AGENT" "$PROMPT" > /tmp/agent-response.txt || {
                    echo "==== Opencode failed, dumping last log ======================"
                    tail -n 100 "$(ls -t ~/.local/share/opencode/log/*.log 2>/dev/null | head -n 1)" || echo "No log found"
                    exit 1
                  }
                  echo  "==== response ==============================================="
                  cat /tmp/agent-response.txt
