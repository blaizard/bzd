name: "Cybersecurity: apps/artifacts"

on:
    workflow_dispatch: # allows manual triggering
    schedule:
        - cron: "0 18 * * 6" # runs every sunday at 18:00 UTC (monday 03:00 JST)

jobs:
    lease_linux:
        runs-on: node_manager_client
        steps:
            - name: "Lease Linux"
              uses: https://git.blaizard.com/blaise/deployment/ci/gitea/lease_linux@main
              with:
                  name: "ci"
                  ttl: "300"

    cybersecurity_artifacts:
        needs: [lease_linux]
        runs-on: opencode
        uses: ./.gitea/workflows/sub_cybersecurity.yml
        secrets: inherit
        with:
            prompt: |
                Deploy the app with (this call is blocking, run in a detached process):
                `./tools/bazel run //apps/artifacts/backend/tests:restricted_user --config=prod -- --port 8081`

                Stress-test and probe its API (on http://localhost:8081) for security flaws:
                auth issues, injection, input validation, rate limiting, info disclosure, etc.
                Enumerate endpoints first, then test each.
