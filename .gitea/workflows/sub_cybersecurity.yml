name: Cybersecurity Agent

on:
    workflow_call:
        inputs:
            prompt:
                description: "The prompt to be used for the agent."
                required: true
                type: string
            agent:
                description: "The agent to be using."
                required: false
                default: "build"
                type: string

jobs:
    cybersecurity:
        runs-on: opencode
        steps:
            - uses: https://git.blaizard.com/blaise/deployment/ci/gitea/setup@main
              with:
                  lease: "true"
                  opencode_token: ${{ secrets.BZD_OPENCODE_TOKEN }}

            - uses: ./.gitea/actions/opencode
              with:
                  agent: ${{ inputs.agent }}
                  prompt: |
                      Act as a cybersecurity engineer.

                      FIRST, use Gitea MCP tool to search OPEN issues with titles starting with
                      "[CYBERSECURITY]". There are known and being fixed. Do NOT re-report them. Find NEW vulnerabilities.

                      THEN
                      ${{ inputs.prompt }}

                      IMPORTANT: Stop IMMEDIATELY after finding the FIRST vulnerability.

                      Output your final answer as a single JSON object and NOTHING else, in this exact format:

                      If a vulnerability is found:
                      {
                        "vulnerability_found": true,
                        "title": "...",
                        "severity": "Critical|High|Medium|Low",
                        "description": "...",
                        "reproduction_steps": "..."
                      }

                      If NO vulnerability is found:
                      {
                        "vulnerability_found": false
                      }

            - name: "Extract JSON"
              id: parse
              shell: bash
              run: |
                  cp /tmp/agent-response.txt /tmp/agent-response.json

                  echo "==== json =============================================="
                  cat /tmp/agent-response.json

                  vulnerability_found=$(jq -r '.vulnerability_found // false' /tmp/agent-response.json)
                  title=$(jq -r '.title' /tmp/agent-response.json)
                  severity=$(jq -r '.severity' /tmp/agent-response.json)
                  description=$(jq -r '.description' /tmp/agent-response.json)
                  reproduction_steps=$(jq -r '.reproduction_steps' /tmp/agent-response.json)

                  echo "vulnerability_found=$vulnerability_found" >> "$GITHUB_OUTPUT"
                  echo "ISSUE_TITLE=[CYBERSECURITY] [$severity] $title" >> "$GITHUB_ENV"
                  {
                    echo "ISSUE_BODY<<__BODY_EOF__"
                    echo "**Severity:** $severity"
                    echo ""
                    echo "## Description"
                    echo "$description"
                    echo ""
                    echo "## Reproduction Steps"
                    echo "$reproduction_steps"
                    echo ""
                    echo "_Auto-generated by cybersecurity agent._"
                    echo "__BODY_EOF__"
                  } >> "$GITHUB_ENV"

            - name: "Create issue"
              if: steps.parse.outputs.vulnerability_found == 'true'
              uses: ./.gitea/actions/issue
              with:
                  token: ${{ secrets.BZD_AGENT_TOKEN }}
                  title: ${{ env.ISSUE_TITLE }}
                  body: ${{ env.ISSUE_BODY }}
