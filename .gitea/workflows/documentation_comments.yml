name: "Documentation: Comments"

on:
    workflow_dispatch: # allows manual triggering
    schedule:
        - cron: "0 18 * * 2"

jobs:
    lease_linux:
        runs-on: node_manager_client
        steps:
            - name: "Lease Linux"
              uses: https://git.blaizard.com/blaise/deployment/ci/gitea/lease_linux@main
              with:
                  name: "ci"
                  ttl: "300"

    documentation_comments:
        needs: [lease_linux]
        runs-on: opencode
        uses: ./.gitea/workflows/sub_documentation.yml
        secrets: inherit
        with:
            prompt: |
                # Role: Monorepo Technical Editor & Comments Auditor

                Review code comments for accuracy and clear errors. Default to leaving comments untouched.

                ## Instructions
                1. **Fix Inaccuracies:** Update a comment only if it contradicts how the adjacent code actually works.
                2. **Fix Obvious Errors:** Correct blatant typos, spelling errors, or broken grammar without changing the surrounding sentence structure.
                3. **No Rephrasing:** Never rewrite, polish, or rephrase a comment for style, flow, or conciseness. If a comment is accurate and understandable, do not touch it.
