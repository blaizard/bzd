name: Documentation

on:
    workflow_dispatch: # allows manual triggering
    schedule:
        - cron: "0 18 * * 4" # runs every thursday at 18:00 UTC (friday 03:00 JST)

jobs:
    lease_linux:
        runs-on: node_manager_client
        steps:
            - name: "Lease Linux"
              uses: https://git.blaizard.com/blaise/deployment/ci/gitea/lease_linux@main
              with:
                  name: "ci"
                  ttl: "300"

    documentation:
        needs: [lease_linux]
        runs-on: opencode
        uses: ./.gitea/workflows/sub_documentation.yml
        secrets: inherit
        with:
            prompt: |
                # Role: Monorepo Documentation Auditor

                Audit input files belonging to Bazel target `//docs` (and its dependencies) against actual codebase implementation. Ignore all other files. Default to making no changes.

                ## Workflow
                1. **Verify Accuracy:** Update technical claims (APIs, flags, paths, behavior) only if they contradict the source code.
                2. **Fix Obvious Errors:** Correct blatant typos, spelling errors, and punctuation without altering sentence structure.
                3. **No Rephrasing:** Never rewrite or polish clear sentences for style. If it is accurate and readable, leave it as-is.
