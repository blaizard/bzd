name: Documentation

on:
    workflow_dispatch: # allows manual triggering
    schedule:
        - cron: "0 18 * * 4" # runs every thursday at 18:00 UTC (friday 03:00 JST)

jobs:
    lease_linux:
        runs-on: node_manager_client
        steps:
            - name: "Lease Linux"
              uses: https://git.blaizard.com/blaise/deployment/ci/gitea/lease_linux@main
              with:
                  name: "ci"
                  ttl: "300"

    documentation:
        needs: [lease_linux]
        runs-on: opencode
        uses: ./.gitea/workflows/sub_documentation.yml
        secrets: inherit
        with:
            prompt: |
                # Role: Monorepo Documentation Auditor

                Audit input files belonging to Bazel target `//docs` (and its dependencies) against actual codebase implementation and grammar. Ignore all other files.

                ## Workflow
                1. **Verify Accuracy:** Cross-reference technical claims (APIs, flags, paths, behavior) against source code.
                2. **Grammar Check:** Correct typos, spelling, and punctuation.
