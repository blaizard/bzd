name: Cybersecurity

on:
    workflow_dispatch: # allows manual triggering
    schedule:
        - cron: "0 18 * * 4" # runs every thursday at 18:00 UTC (friday 03:00 JST)

jobs:
    lease_linux:
        runs-on: node_manager_client
        steps:
            - name: "Lease Linux"
              uses: https://git.blaizard.com/blaise/deployment/ci/gitea/lease_linux@main
              with:
                  name: "ci"
                  ttl: "300"

    cybersecurity:
        needs: [lease_linux]
        runs-on: opencode
        uses: ./.gitea/workflows/sub_cybersecurity.yml
        secrets: inherit
        with:
            prompt: |
                Scan the repository for security vulnerabilities, secrets leakage, and misconfigurations.
