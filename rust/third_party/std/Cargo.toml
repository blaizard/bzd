# Dependency carrier for the Bazel `@crates_std` universe.
# This package is never compiled by Cargo, it only declares the dependencies
# consumed through `crate.from_cargo` in std.MODULE.bazel.

[package]
name = "bzd-rust-deps"
version = "0.0.0"
edition = "2024"
publish = false

[target.'cfg(target_os = "linux")'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["decoding", "input-v4l"] }

[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["decoding", "input-avfoundation"] }

[dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
embassy-executor = { version = "0.10.0", features = ["executor-thread", "platform-std"] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["std"] }
embedded-io-async = "0.7.0"
embedded-nal-async = "0.9.0"
getrandom = "0.2.15"
quote = "1.0"
std-embedded-nal-async = "0.4.0"
syn = { version = "2.0", features = ["full"] }
