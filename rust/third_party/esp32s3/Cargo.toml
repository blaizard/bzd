# Dependency carrier for the Bazel `@crates_esp32s3` universe.
# This package is never compiled by Cargo, it only declares the dependencies
# consumed through `crate.from_cargo` in esp32s3.MODULE.bazel.

[package]
name = "bzd-espressif-esp32s3-deps"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
critical-section = "1.2.0"
embassy-executor = "0.10.0"
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["generic-queue-8"] }
esp-backtrace = { version = "0.19.0", features = ["esp32s3", "println"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
esp-hal = { version = "1.1.2", features = ["esp32s3", "rt", "unstable"] }
esp-println = { version = "0.17.0", default-features = false, features = ["auto", "esp32s3"] }
esp-rom-sys = "=0.1.4" # 0.1.5 needs unstable cfg_select.
esp-rtos = { version = "0.3.0", features = ["embassy", "esp32s3"] }
# 0.35.3 breaks.
esp32s3 = "=0.35.2"
xtensa-lx = "0.13.0"
xtensa-lx-rt = "0.22.0"
