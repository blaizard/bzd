# Dependency carrier for the Bazel `@crates_esp32s3` universe.
# This package is never compiled by Cargo, it only declares the dependencies
# consumed through `crate.from_cargo` in esp32s3.MODULE.bazel.

[package]
name = "bzd-espressif-esp32s3-deps"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
critical-section = "1.2.0"
embassy-executor = "0.10.0"
embassy-net = { version = "0.9.1", features = ["dhcpv4", "medium-ethernet", "proto-ipv6", "tcp", "dns"] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["generic-queue-8"] }
embedded-io-async = "0.7.0"
embedded-nal-async = "0.9.0"
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.20.0", features = ["esp32s3", "println"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }
esp-hal = { version = "1.2.2", features = ["esp32s3", "rt", "unstable"] }
esp-println = { version = "0.18.0", default-features = false, features = ["auto", "esp32s3"] }
esp-radio = { version = "1.0.0-beta.1", features = ["wifi", "esp32s3"] }
esp-rom-sys = "=0.1.5"
esp-rtos = { version = "0.4.0", features = ["embassy", "esp-radio", "esp32s3"] }
portable-atomic = "1.15.0"
esp32s3 = "0.37.0"
xtensa-lx = "0.13.0"
xtensa-lx-rt = "0.23.0"
