# Dependency carrier for the Bazel `@crates_esp32` universe.
# This package is never compiled by Cargo, it only declares the dependencies
# consumed through `crate.from_cargo` in esp32.MODULE.bazel.

[package]
name = "bzd-espressif-esp32-deps"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
critical-section = "1.2.0"
embassy-executor = "0.10.0"
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["generic-queue-8"] }
embedded-io-async = "0.7.0"
esp-backtrace = { version = "0.19.0", features = ["esp32", "println"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32"] }
esp-hal = { version = "1.1.2", features = ["esp32", "rt", "unstable"] }
esp-println = { version = "0.17.0", default-features = false, features = ["auto", "esp32"] }
esp-rom-sys = "=0.1.4" # 0.1.5 needs unstable cfg_select.
esp-rtos = { version = "0.3.0", features = ["embassy", "esp32"] }
# 0.41.0 requires esp-rom-sys 0.1.5 which needs unstable cfg_select.
esp32 = "=0.40.2"
static_cell = "2.1.1"
xtensa-lx = "0.13.0"
xtensa-lx-rt = "0.22.0"
